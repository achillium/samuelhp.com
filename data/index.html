<!DOCTYPE html>
<html lang="en">

    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Samuel HP's Data</title>
        <link rel="stylesheet" type="text/css" href="../samuelhp_files/styles.css">
        
        <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
        <link rel="manifest" href="../site.webmanifest">
      <style>
      </style>
		<script src="https://d3js.org/d3.v7.min.js"></script>
    </head>

    <body>
	<canvas id="starfield" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;"></canvas>
    
    
        <div class="">
	            <div style="display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 1rem;">
                    <a href="../"><img src="../arrow.png" style="width:25px; height:25px; border-radius:4px; transform: scaleX(-1);"></a>
                    <a href="../" class="h1link">
                        <img class="title" src="../ego.png" style="height:4rem; margin-top:0;">
                    </a>
                    <a href="../"><img src="../arrow.png" style="width:25px; height:25px; border-radius:4px;"></a>
                </div>
			    <br/>
			<div>
				<h2 style="white-space: nowrap;">Pomodoros 🍅</h2>
			</div>
		</div>
		
			<div class="tooltip" id="tooltip"></div>
			<div id="heatmapContainer">
				<svg id="heatmap" width="980" height="160"></svg>
			</div>

			<script>
			const width = 980;
			const cellSize = 12;
			const padding = 4;
			const yearDays = 365;

			const today = new Date();
			const endDate = d3.timeDay.floor(today);
			const startDate = d3.timeDay.offset(endDate, -yearDays + 2);

			const svg = d3.select("#heatmap");
			const tooltip = d3.select("#tooltip");

			d3.csv("./pomodoro/history.csv").then(data => {
			  const counts = d3.rollup(data, v => v.length, d => d["End Date"]);

			  const colorScale = d3.scaleThreshold()
				.domain([1, 2, 3, 5, 10])
								.range(["#ebedf0", "#f8caca", "#ee9999", "#c55a5a", "#c21c1c"]);
								//.range(["#ebedf0", "#9be9a8", "#40c463", "#30a14e", "#216e39"]);

			  const days = d3.timeDays(startDate, d3.timeDay.offset(endDate, 1));
			  const g = svg.append("g").attr("transform", `translate(35, 20)`);

			  // --- Day rectangles ---
			  g.selectAll(".day")
				.data(days)
				.join("rect")
				.attr("class", "day")
				.attr("width", cellSize)
				.attr("height", cellSize)
				.attr("x", d => d3.timeWeek.count(startDate, d) * (cellSize + padding))
				.attr("y", d => d.getDay() * (cellSize + padding))
				.attr("rx", 2).attr("ry", 2)
				.attr("fill", d => {
				  const dateStr = d.toISOString().slice(0, 10);
				  const count = counts.get(dateStr) || 0;
				  return colorScale(count);
				})
				.on("mousemove", function (event, d) {
				  const dateStr = d.toISOString().slice(0, 10);
				  const count = counts.get(dateStr) || 0;
				  tooltip
					.style("opacity", 1)
					.html(`${count} entr${count === 1 ? "y" : "ies"}<br>${dateStr}`)
					.style("left", (event.clientX + 12) + "px")
					.style("top", (event.clientY - 20) + "px");
				})
				.on("mouseout", () => tooltip.style("opacity", 0));

			  // --- Month labels ---
			  g.selectAll(".month-label")
				.data(d3.timeMonths(startDate, endDate))
				.join("text")
				.attr("class", "month-label")
				.attr("x", d => d3.timeWeek.count(startDate, d) * (cellSize + padding))
				.attr("y", -5)
				.text(d3.timeFormat("%b"));

			  // --- Weekday labels (Mon, Wed, Fri only for clean look) ---
			  const weekDays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
			  svg.append("g")
				.attr("transform", "translate(25, 26)")
				.selectAll(".week-label")
				.data(weekDays)
				.join("text")
				.attr("class", "week-label")
				.attr("x", 0)
				.attr("y", (d, i) => i * (cellSize + padding) + 9)
				.text(d => (i % 2 === 0 ? d : "")); // label every other line (Sun, Tue, Thu, Sat)
			});
			
			</script>
			
        </div>
	<script>
	const starCanvas = document.getElementById('starfield');
	const starCtx = starCanvas.getContext('2d');
	let stars = [];
	function resizeStarCanvas() { starCanvas.width = window.innerWidth; starCanvas.height = window.innerHeight; }
	function initStars() {
		stars = [];
		const starCount = Math.floor((window.innerWidth * window.innerHeight) / 2500);
		for (let i = 0; i < starCount; i++) {
			stars.push({ x: Math.random() * starCanvas.width, y: Math.random() * starCanvas.height, r: Math.random() * 1.4 + 0.3, opacity: Math.random() * 0.5 + 0.3, speed: Math.random() * 0.12 + 0.02, twinkle: Math.random() * Math.PI * 2, twinkleSpeed: Math.random() * 0.015 + 0.003 });
		}
	}
	function animateStars() {
		starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
		for (let s of stars) {
			s.y += s.speed; s.twinkle += s.twinkleSpeed;
			if (s.y > starCanvas.height + 5) { s.y = -5; s.x = Math.random() * starCanvas.width; }
			const tw = s.opacity * (0.6 + 0.4 * Math.sin(s.twinkle));
			starCtx.beginPath(); starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
			starCtx.fillStyle = `rgba(255, 255, 255, ${tw})`; starCtx.fill();
		}
		requestAnimationFrame(animateStars);
	}
	resizeStarCanvas(); initStars(); animateStars();
	window.addEventListener('resize', () => { resizeStarCanvas(); initStars(); });
	</script>
</body>

</html>
